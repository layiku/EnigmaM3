<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---- perf helper: merge static meshes under `container` into one mesh per material ---- */
const _bakeInv = new THREE.Matrix4(), _bakeM = new THREE.Matrix4();
function bakeStatic(container) {
  container.updateMatrixWorld(true);
  _bakeInv.copy(container.matrixWorld).invert();
  const buckets = new Map(), victims = [];
  container.traverse(o => {
    if (!o.isMesh || o === container || Array.isArray(o.material) || o.userData.noBake || !o.material.visible) return;
    for (let p = o.parent; p && p !== container; p = p.parent) if (p.userData.noBake) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv || !g.attributes.normal) { g.dispose(); return; }
    g.clearGroups(); g.applyMatrix4(_bakeM.multiplyMatrices(_bakeInv, o.matrixWorld));
    let b = buckets.get(o.material); if (!b) buckets.set(o.material, b = { gs: [], cast: false });
    b.gs.push(g); b.cast = b.cast || o.castShadow; victims.push(o);
  });
  const oldGeos = new Set(victims.map(v => v.geometry));
  victims.forEach(o => o.parent.remove(o));
  container.traverse(o => { if (o.geometry) oldGeos.delete(o.geometry); });
  oldGeos.forEach(g => g.dispose());
  const out = new THREE.Group(); out.name = 'baked';
  for (const [mat, b] of buckets) { const m = new THREE.Mesh(mergeGeometries(b.gs, false), mat); m.castShadow = b.cast; m.receiveShadow = true; out.add(m); b.gs.forEach(g => g.dispose()); }
  container.add(out); return out;
}
function disposeTree(o, mats = false) { o.traverse(n => { if (n.geometry) n.geometry.dispose(); if (mats && n.material && !n.material.userData?.shared) (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => m.dispose()); }); }
const gsap = window.gsap;

/* ============================================================
   1. CRYPTO CORE
   ============================================================ */
class EnigmaEngine {
  static ROTORS = {
    I:   { wiring: 'EKMFLGDQVZNTOWYHXUSPAIBRCJ', notch: 'Q' },
    II:  { wiring: 'AJDKSIRUXBLHWTMCQGZNPYFVOE', notch: 'E' },
    III: { wiring: 'BDFHJLCPRTXVZNYEIWGAKMUSQO', notch: 'V' },
    IV:  { wiring: 'ESOVPZJAYQUIRHXLNFTGKDCMWB', notch: 'J' },
    V:   { wiring: 'VZBRGITYUPSDNHLXAWMJQOFECK', notch: 'Z' },
    VI:  { wiring: 'JPGVOUMFYQBENHZRDKASXLICTW', notch: 'ZM' },
    VII: { wiring: 'NZJHGRCXMYSWBOUFAIVLPEKQDT', notch: 'ZM' },
    VIII:{ wiring: 'FKQHTLXOCBJSPDZRAMEWNIUYGV', notch: 'ZM' }
  };
  static REFLECTOR_B = 'YRUHQSLDPXNGOKMIEBFZCWVJAT';
  static REFLECTORS = { B: 'YRUHQSLDPXNGOKMIEBFZCWVJAT', C: 'FVPJIAOYEDRZXWGCTKUQSBNMHL' };
  static A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  constructor() {
    this.order = ['I', 'II', 'III'];   // left, middle, right
    this.rings = [0, 0, 0];
    this.positions = [0, 0, 0];
    this.setReflector('B');
    this.plug = [...Array(26).keys()];
    this._build();
  }
  setReflector(name) { this.reflectorName = name; this.reflector = EnigmaEngine.REFLECTORS[name].split('').map(c => c.charCodeAt(0) - 65); }
  _build() {
    this.fw = []; this.bw = []; this.notch = [];
    this.order.forEach((n, i) => {
      const d = EnigmaEngine.ROTORS[n];
      const f = d.wiring.split('').map(c => c.charCodeAt(0) - 65);
      const b = new Array(26); f.forEach((v, k) => b[v] = k);
      this.fw[i] = f; this.bw[i] = b; this.notch[i] = d.notch.split('').map(c => c.charCodeAt(0) - 65);
    });
  }
  static idx(c) { return c.toUpperCase().charCodeAt(0) - 65; }
  static chr(i) { return String.fromCharCode(65 + ((i % 26) + 26) % 26); }
  setRotorOrder(order) { this.order = order.slice(); this._build(); }
  setRings(r) { this.rings = [...r].map(x => typeof x === 'string' ? EnigmaEngine.idx(x) : x); }
  setPositions(p) { this.positions = [...p].map(x => typeof x === 'string' ? EnigmaEngine.idx(x) : x); }
  getPositionString() { return this.positions.map(EnigmaEngine.chr).join(''); }
  // ---- plugboard ----
  get pairs() {
    const out = [];
    for (let i = 0; i < 26; i++) if (this.plug[i] > i) out.push(EnigmaEngine.chr(i) + EnigmaEngine.chr(this.plug[i]));
    return out;
  }
  isPlugged(c) { const i = EnigmaEngine.idx(c); return this.plug[i] !== i; }
  connect(a, b) {
    const i = EnigmaEngine.idx(a), j = EnigmaEngine.idx(b);
    if (i === j || this.plug[i] !== i || this.plug[j] !== j || this.pairs.length >= 13) return false;
    this.plug[i] = j; this.plug[j] = i; return true;
  }
  disconnect(a) {
    const i = EnigmaEngine.idx(a), j = this.plug[i];
    if (j === i) return false;
    this.plug[i] = i; this.plug[j] = j; return true;
  }
  clearPlugboard() { this.plug = [...Array(26).keys()]; }
  setPlugboard(str) {
    this.clearPlugboard();
    (str || '').toUpperCase().split(/[^A-Z]+/).filter(Boolean).forEach(p => this.connect(p[0], p[1]));
  }
  randomPlugboard(n = 13) {
    this.clearPlugboard();
    const l = [...Array(26).keys()];
    for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
    for (let k = 0; k < n; k++) this.connect(EnigmaEngine.chr(l[2 * k]), EnigmaEngine.chr(l[2 * k + 1]));
    return this.pairs;
  }
  // ---- mechanics ----
  step() {
    const p = this.positions, n = this.notch, stepped = [false, false, true];
    if (n[1].includes(p[1])) {           // double-step: middle at notch steps itself and left
      p[0] = (p[0] + 1) % 26; p[1] = (p[1] + 1) % 26; stepped[0] = stepped[1] = true;
    } else if (n[2].includes(p[2])) {
      p[1] = (p[1] + 1) % 26; stepped[1] = true;
    }
    p[2] = (p[2] + 1) % 26;
    return stepped;
  }
  _pass(i, c, back) {
    const s = (this.positions[i] - this.rings[i] + 26) % 26;
    const contact = (c + s) % 26;
    const exit = back ? this.bw[i][contact] : this.fw[i][contact];
    return { rotor: this.order[i], slot: i, inChar: EnigmaEngine.chr(c), entryContact: contact,
             wire: back ? exit : contact, exitContact: exit, out: (exit - s + 26) % 26,
             outChar: EnigmaEngine.chr(exit - s) };
  }
  encryptChar(ch) {
    const k = EnigmaEngine.idx(ch);
    if (k < 0 || k > 25) return null;
    const before = this.getPositionString();
    const stepped = this.step();
    let c = this.plug[k];
    const plugIn = { from: EnigmaEngine.chr(k), to: EnigmaEngine.chr(c), swapped: c !== k };
    const forward = [];
    for (const i of [2, 1, 0]) { const r = this._pass(i, c, false); forward.push(r); c = r.out; }
    const rin = c; c = this.reflector[c];
    const reflector = { inChar: EnigmaEngine.chr(rin), outChar: EnigmaEngine.chr(c), in: rin, out: c };
    const backward = [];
    for (const i of [0, 1, 2]) { const r = this._pass(i, c, true); backward.push(r); c = r.out; }
    const o = this.plug[c];
    const plugOut = { from: EnigmaEngine.chr(c), to: EnigmaEngine.chr(o), swapped: o !== c };
    return { key: EnigmaEngine.chr(k), positionsBefore: before, positionsAfter: this.getPositionString(),
             stepped, plugIn, forward, reflector, backward, plugOut, lamp: EnigmaEngine.chr(o), output: EnigmaEngine.chr(o) };
  }
  encryptString(s) { return s.toUpperCase().replace(/[^A-Z]/g, '').split('').map(c => this.encryptChar(c).output).join(''); }
}
// END EnigmaEngine

/* ============================================================
   Web Audio
   ============================================================ */
class MechAudio {
  constructor() { this.ctx = null; }
  _c() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  _noise(dur, t0, filterType, freq, gainV, q = 1) {
    const ctx = this._c(), len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.value = gainV;
    src.connect(f).connect(g).connect(ctx.destination); src.start(t0);
  }
  _tone(type, f0, f1, dur, t0, gainV) {
    const ctx = this._c(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(gainV, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  key() { const t = this._c().currentTime; this._tone('sine', 140, 50, 0.12, t, 0.5); this._noise(0.08, t, 'lowpass', 900, 0.6); this._noise(0.05, t + 0.09, 'bandpass', 1800, 0.25, 3); }
  ratchet(n = 1) { const t = this._c().currentTime; for (let i = 0; i < n; i++) { this._noise(0.025, t + i * 0.045, 'highpass', 3500, 0.5); this._tone('square', 2400, 1200, 0.02, t + i * 0.045, 0.05); } }
  snap() { const t = this._c().currentTime; this._tone('triangle', 3200, 1500, 0.06, t, 0.25); this._noise(0.04, t, 'highpass', 5000, 0.5); }
  clunk() { const t = this._c().currentTime; this._tone('triangle', 1900, 900, 0.09, t, 0.3); this._tone('sine', 220, 80, 0.12, t, 0.4); this._noise(0.06, t, 'bandpass', 2600, 0.7, 2); this._tone('sine', 4200, 4000, 0.25, t + 0.01, 0.04); }
  pull() { const t = this._c().currentTime; this._noise(0.08, t, 'bandpass', 1200, 0.5, 1.5); this._tone('sine', 600, 1200, 0.08, t, 0.08); }
}

/* ============================================================
   Procedural textures
   ============================================================ */
const Tex = {
  canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  walnut() {
    const c = this.canvas(512, 512), g = c.getContext('2d');
    g.fillStyle = '#3b2213'; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 260; i++) {
      const y = Math.random() * 512, a = 0.05 + Math.random() * 0.15;
      g.strokeStyle = Math.random() < 0.5 ? `rgba(20,8,2,${a})` : `rgba(120,70,35,${a})`;
      g.lineWidth = 0.5 + Math.random() * 2.5; g.beginPath();
      for (let x = 0; x <= 512; x += 16) g.lineTo(x, y + Math.sin(x * 0.012 + i) * 6 + Math.sin(x * 0.05 + i * 3) * 1.5);
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
  },
  crinkle() {
    const c = this.canvas(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256);
    for (let i = 0; i < im.data.length; i += 4) { const v = 90 + Math.random() * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); g.globalAlpha = 0.35;

    // reduced if it would cover the machine in the current camera view

    const L = ui.right + 12, Rb = help.left - 12, top = 16;

class InteractionController {

    this.$('bFlow').onclick = () => this.flow.toggle();
    this.setLang(lang, true);
    requestAnimationFrame(() => this.flow.toggle(true));  // open on load (after widgets are placed)
    this._winWidget();
  }
  _floatWidget(w, key, autoPos, skipSel) {
    let user = null; try { user = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    const clamp = (x, y) => [Math.max(0, Math.min(innerWidth - w.offsetWidth, x)), Math.max(0, Math.min(innerHeight - w.offsetHeight, y))];
    const place = (x, y) => { [x, y] = clamp(x, y); w.style.left = x + 'px'; w.style.top = y + 'px'; return [x, y]; };
    const auto = () => { const [x, y] = autoPos(); place(x, y); };
    const layout = () => user ? place(user[0], user[1]) : auto();
    layout(); addEventListener('resize', layout);
    let d = null;
    w.addEventListener('pointerdown', (e) => { e.stopPropagation(); if (skipSel && e.target.closest(skipSel)) return; e.preventDefault(); const r = w.getBoundingClientRect(); d = { dx: e.clientX - r.left, dy: e.clientY - r.top }; w.setPointerCapture(e.pointerId); });
    w.addEventListener('pointermove', (e) => { if (!d) return; e.stopPropagation(); user = place(e.clientX - d.dx, e.clientY - d.dy); });
    const end = () => { if (!d) return; d = null; try { localStorage.setItem(key, JSON.stringify(user)); } catch (er) {} };
    w.addEventListener('pointerup', end); w.addEventListener('pointercancel', end);
    w.addEventListener('dblclick', (e) => { if (skipSel && e.target.closest(skipSel)) return; user = null; try { localStorage.removeItem(key); } catch (er) {} auto(); });
    return layout;
  }
  _winWidget() {
    // one tool widget: rotor readout tiles + pan pad; default directly below the help box, right-aligned
    try { localStorage.removeItem('enigmaWinPos'); localStorage.removeItem('enigmaPanPos'); localStorage.removeItem('enigmaReadoutPos'); } catch (e) {}
    const help = this.$('help'), win = this.$('win');
    this._floatWidget(win, 'enigmaToolPos', () => { const r = help.getBoundingClientRect(); return [r.right - win.offsetWidth, r.bottom + 10]; }, '#pad button');
    this._panPad();
  }
  fullReset() {
    const e = this.engine, changed = e.order.join() !== 'I,II,III', reflChanged = e.reflectorName !== 'B';
    e.setRotorOrder(['I', 'II', 'III']); e.setRings([0, 0, 0]); e.setPositions([0, 0, 0]); e.setReflector('B');
    this.startPos = [0, 0, 0];
    for (let i = 0; i < 3; i++) { this.$('o' + i).value = e.order[i]; this.$('r' + i).value = 'A'; if (changed) this.s.setRotorWiring(i); }
    this.$('refl').value = 'B'; if (reflChanged) this.s.buildReflectorWires();
    this.s.syncRotors(); this.refreshWindows();
    this.audio.ratchet(3); setTimeout(() => this.audio.ratchet(3), 160);
  }
  toast(msg) {
    let t = this.$('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1b1712ee;color:#f0dca0;border:1px solid #c9a24a;padding:8px 12px;font:12px Courier New,monospace;z-index:20;border-radius:3px;box-shadow:0 4px 16px #000a;pointer-events:none;white-space:pre'; document.body.appendChild(t); }
    t.textContent = msg; gsap.killTweensOf(t); gsap.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.15 }); gsap.to(t, { opacity: 0, duration: 0.4, delay: 3 });
  }
  copyView() {
    const r = (v) => [v.x, v.y, v.z].map(n => Math.round(n * 1000) / 1000);
    const json = JSON.stringify({ pos: r(this.s.camera.position), target: r(this.s.controls.target) });
    const ok = () => this.toast(I18N.t('viewCopied') + '\n' + json), fail = () => this.toast(json);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(ok, fail); else fail();
  }
  _panPad() {
    const s = this.s, cam = s.camera, ctl = s.controls, v = new THREE.Vector3(), tmp = new THREE.Vector3();
    const dirOf = (kind) => {
      cam.updateMatrixWorld();
      if (kind === 'left' || kind === 'right') v.setFromMatrixColumn(cam.matrixWorld, 0).multiplyScalar(kind === 'right' ? 1 : -1);
      else if (kind === 'up' || kind === 'down') v.setFromMatrixColumn(cam.matrixWorld, 1).multiplyScalar(kind === 'up' ? 1 : -1);
      else { cam.getWorldDirection(v); v.y = 0; if (v.lengthSq() < 1e-8) v.set(0, 0, -1); v.normalize(); if (kind === 'back') v.negate(); }
      return v;
    };
    const move = (kind, amount) => {   // amount in fractions of camera distance
      const d = cam.position.distanceTo(ctl.target);
      tmp.copy(dirOf(kind)).multiplyScalar(d * amount);
      // screen up/down/left/right: machine appears to move opposite to the camera, like dragging the view
      cam.position.add(tmp); ctl.target.add(tmp); ctl.update(); s.invalidate && s.invalidate();
    };
    let hold = null;
    const stop = () => { if (hold) { cancelAnimationFrame(hold.raf); clearTimeout(hold.timer); hold = null; } };
    document.querySelectorAll('#pad button').forEach(b => {
      const kind = b.dataset.pan;
      b.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); e.preventDefault(); stop();
        if (kind === 'home') {
          const [px, py, pz] = Enigma3DScene.HOME.pos, [tx, ty, tz] = Enigma3DScene.HOME.target;
          s.flyCamera({ x: px, y: py, z: pz }, { x: tx, y: ty, z: tz }, !ctl.enableRotate); return;
        }
        gsap.killTweensOf(cam.position); gsap.killTweensOf(ctl.target);
        move(kind, 0.04); try { b.setPointerCapture(e.pointerId); } catch (er) {}
        hold = { timer: setTimeout(() => {
          let last = performance.now();
          const tick = (now) => { if (!hold) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; move(kind, 0.5 * dt); hold.raf = requestAnimationFrame(tick); };
          hold.raf = requestAnimationFrame(tick);
        }, 250), raf: 0 };
      });
      for (const ev of ['pointerup', 'pointerleave', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, (e) => { e.stopPropagation(); stop(); });
      b.addEventListener('click', (e) => e.stopPropagation());
    });
    addEventListener('blur', stop);
  }
  _on(id, v) { this.$(id).classList.toggle('on', v); }
  changeOrder(slot) {
    const nv = this.$('o' + slot).value, order = this.engine.order.slice(), j = order.indexOf(nv);
    if (j >= 0 && j !== slot) order[j] = order[slot];
    order[slot] = nv; this.engine.setRotorOrder(order);
    for (let i = 0; i < 3; i++) { this.$('o' + i).value = order[i]; this.s.setRotorWiring(i); }
    this.s.syncRotors();
    this.audio.ratchet(2);
  }
  refreshPairs(msg) {
    const p = this.engine.pairs; this.$('pairs').textContent = p.length ? p.join(' ') + `  (${p.length}/13)` : I18N.t('none');
    this.$('msg').textContent = typeof msg === 'string' ? msg : '';
  }
  refreshWindows() {
    for (let i = 0; i < 3; i++) { const c = EnigmaEngine.chr(this.engine.positions[i]); this.$('w' + i).textContent = c; this.$('p' + i).value = c; }
  }
  _pointer() {
    const cv = this.s.renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    cv.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const hit = this.pb.pick(e);
      if (hit && this.pb.onPointerDown(e, hit)) { this.s.controls.enabled = false; cv.setPointerCapture(e.pointerId); return; }
      this.s.toNDC(e, ndc); ray.setFromCamera(ndc, this.s.camera);
      const keyObjs = Object.values(this.s.keys), kh = ray.intersectObjects(keyObjs, true)[0];
      const rh = ray.intersectObjects(this.s.rotors.map(r => r.hit), false)[0];
      if (kh && (!rh || kh.distance < rh.distance)) { this.press(kh.object.userData.key); return; }
      if (rh) {
        const slot = rh.object.userData.rotorSlot, c = new THREE.Vector3(); rh.object.getWorldPosition(c);
        const dir = rh.point.y >= c.y ? 1 : -1;
        this.engine.positions[slot] = (this.engine.positions[slot] + dir + 26) % 26; this.startPos = this.engine.positions.slice();
        this.s.syncRotors(); this.audio.ratchet(1); this.refreshWindows();
      }
    });
    cv.addEventListener('pointermove', (e) => this.pb.onPointerMove(e));
    const up = () => { if (this.pb.drag) this.pb.onPointerUp(); this.s.controls.enabled = true; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  }
  _keyboard() {
    addEventListener('keydown', (e) => {
      const t = e.target.tagName; if (t === 'TEXTAREA' || t === 'INPUT' || t === 'SELECT' || e.repeat || e.ctrlKey || e.metaKey) return;
      if (e.shiftKey && (e.key === 'V' || e.key === 'v')) { e.preventDefault(); this.copyView(); return; }  // Shift+V: plain V is an Enigma key
      if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); this.press(e.key.toUpperCase()); }
    });
  }
  static translit(s) { return String(s).replace(/ß/g, 'SS').replace(/ẞ/g, 'SS').toUpperCase().replace(/Ä/g, 'AE').replace(/Ö/g, 'OE').replace(/Ü/g, 'UE'); }
  async setLang(lang, first = false) {
    const prev = this.lang; this.lang = lang; I18N.lang = lang;
    try { localStorage.setItem('enigmaLang', lang); } catch (e) {}
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = I18N.t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = I18N.t(el.dataset.i18nHtml));
    document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = I18N.t(el.dataset.i18nTitle));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = I18N.t(el.dataset.i18nPh));
    document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    this.$('bExplode').textContent = I18N.t(this.exploded ? 'collapse' : 'explode');
    this.refreshPairs();
    if (this.flow && this.flow.open) { this.flow._footer(); this.flow.kick(); }
    if (lang === 'de' && prev !== 'de' && !first) { this.tapeIn = this.tapeOut = ''; this.renderTapes(); }
    const wantDe = lang === 'de', isDe = ROWS === LAYOUTS.enigma;
    if (wantDe === isDe && !first) return;
    setLayout(wantDe ? 'enigma' : 'qwerty');
    this.s.relayout(); this.pb.relayout();
  }
  typeSeq(str) { [...str].forEach((c, i) => i === 0 ? this.press(c) : setTimeout(() => this.press(c), i * 350)); }
  press(ch) {
    const before = this.engine.positions.slice();
    const path = this.engine.encryptChar(ch); if (!path) return;
    if (this.flow) this.flow.onPress(path);
    this.lastPath = path;
    this.s.pressKey(ch); this.audio.key();
    const nStep = path.stepped.filter(Boolean).length; setTimeout(() => this.audio.ratchet(nStep), 40);
    this.s.syncRotors(); this.refreshWindows();
    setTimeout(() => { this.s.lightLamp(path.lamp); }, 80);
    this.s.showSignalPath(path); this.s.glowHarness(path); this.pb.glowPath(path);
    this.tapeIn += path.key; this.tapeOut += path.output; this.renderTapes();
    return path;
  }
  renderTapes() {
    const grp = (s) => s.replace(/(.{5})/g, '$1 ').trim();
    this.$('tIn').textContent = grp(this.tapeIn); this.$('tOut').textContent = grp(this.tapeOut);
  }
  autoType(text) {
    this.stopAuto();
    const q = InteractionController.translit(text).replace(/[^A-Z]/g, '').split(''); if (!q.length) return;
    this._on('bAuto', true);
    this.auto = setInterval(() => { if (!q.length) return this.stopAuto(); this.press(q.shift()); }, 350);
  }
  stopAuto() { if (this.auto) clearInterval(this.auto); this.auto = null; this._on('bAuto', false); }
}

window.enigmaApp = new InteractionController();
</script>
